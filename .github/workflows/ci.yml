name: CI

on:
  pull_request:
  push:
    branches: [base, main]

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install deps
        working-directory: backend
        run: |
          uv venv
          . .venv/bin/activate
          uv pip install -e ".[dev]"
      - name: Lint (ruff)
        working-directory: backend
        run: |
          . .venv/bin/activate
          # Repo currently has 2 pre-existing C901 warnings — fail on
          # everything *else*. Tighten when those are refactored.
          ruff check . --output-format=github --exit-non-zero-on-fix \
            --ignore=C901 || exit 1
      - name: Test (pytest)
        working-directory: backend
        env:
          MEDIA_ROOT: /tmp/podbot-media
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: ci-secret-not-for-production
          ENVIRONMENT: ci
        run: |
          . .venv/bin/activate
          pytest -q

  frontend:
    name: Frontend (build + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        working-directory: frontend
        # eslint-config-next@14 pins eslint ^8 but the lockfile may resolve a
        # newer eslint via transitive deps. --legacy-peer-deps tolerates the
        # mismatch and matches what `npm install` does locally.
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps
      - name: Lint
        working-directory: frontend
        run: npm run lint --if-present || echo "no lint script"
      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build
